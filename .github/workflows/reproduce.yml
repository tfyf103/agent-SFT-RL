name: Reproduce CPU evidence
on:
  push:
    branches: [main]
    paths:
      - 'bank_agent/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small CPU dependencies
        run: python -m pip install -e ".[dev,toy]"
      - name: Test environment, gradients and isolation
        run: python -m pytest -q
      - name: Generate fixed data
        run: python -m scripts.prepare_data --train 500 --eval 200
      - name: Run scripted environment controls
        run: |
          python -m scripts.evaluate --tasks data/generated/test.jsonl --output artifacts/scripted/test
          python -m scripts.evaluate --tasks data/generated/stress.jsonl --output artifacts/scripted/stress
      - name: Train and evaluate three-seed finite-action policies
        run: python scripts/run_toy_experiment.py --output artifacts/toy_policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-reproduction-evidence
          path: |
            artifacts/
            data/generated/manifest.json
          retention-days: 30
  llm-training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 peft==0.15.2 safetensors==0.5.3
          python -m pip install -e ".[dev,toy]"
      - name: Test including Torch loss gradients
        run: python -m pytest -q
      - name: Execute actual small-language-model SFT and resume check
        run: python -m scripts.cpu_llm_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-llm-smoke-evidence
          path: |
            artifacts/llm-smoke/verification.json
            artifacts/llm-smoke/short-smoke.jsonl
            artifacts/llm-smoke/sft/*.json
            artifacts/llm-smoke/sft/*.jsonl
            artifacts/llm-smoke/sft/step-*/configuration.json
          retention-days: 30
